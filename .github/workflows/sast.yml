name: "SAST"

on:
  push:
  pull_request:

permissions: # least privileges, see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
  contents: read

# clang-tidy fun:
# We need to invoke clang-tidy from the correct directory, the one in which the product was compiled, so that we get the correct include paths.
# This means the root for the auth, pdns/recursordist for the rec and pdns/dnsdistdist for dnsdist
# It is important that files that are used by more than one product are processed by all the products using them
# because they might have difference compilation flags.

env:
  BUILDER_VERSION: '0.0.0-git1'

jobs:
  analyze:
    name: Analyze
    if: ${{ !github.event.schedule || vars.SCHEDULED_CODEQL_ANALYSIS }}
    runs-on: ubuntu-26.04

    permissions:
      actions: read # for github/codeql-action/init to get workflow details
      contents: read  # for actions/checkout to fetch code

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']
        product: ['auth', 'rec', 'dnsdist']

    env:
      COMPILER: gcc
      UNIT_TESTS: no
      FUZZING_TARGETS: no
      COVERAGE: no
      OPTIMIZATIONS: no
      # for clang-tidy only, not compilation
      CLANG_VERSION: '21'
      REPO_HOME: ${{ github.workspace }}
      CARGO_USE_DEV: 1

    steps:
    - uses: PowerDNS/pdns/set-ubuntu-mirror@meta
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Update repository metadata
      run: |
        sudo apt-get update

    - name: Install python invoke and needed libs
      run: |
        sudo apt-get -qq -y --no-install-recommends install python3 python3-pip python3-invoke python3-git python3-unidiff ccache

    - name: Install clang-tidy tools
      run: |
        inv install-clang-tidy-tools

    - name: set up build
      uses: ./.github/actions/cache
      with:
        cache-key-base: ${{ matrix.product }}-ccache-codeql

    - name: Install dependencies for auth
      if: matrix.product == 'auth'
      run: |
        inv install-auth-build-deps
    - name: Autoreconf auth
      if: matrix.product == 'auth'
      run: |
        inv ci-autoconf
    - name: Configure auth
      if: matrix.product == 'auth'
      run: |
        inv ci-auth-configure
    - name: Build auth
      if: matrix.product == 'auth'
      run: |
        inv ci-auth-make-bear
    - name: Print ccache stats
      if: matrix.product == 'auth'
      run: ccache -s
    - name: Run clang-tidy for auth
      if: matrix.product == 'auth'
      run: clang-tidy-${CLANG_VERSION} --config-file=.clang-tidy.bugs pdns/*.cc pdns/backends/*.cc modules/*/*.cc -p build -export-fixes=$REPO_HOME/clang-fixes.yml -extra-arg=-ferror-limit=0

    - name: Generate SAST reports for auth
      if: matrix.product == 'auth'
      run: python3 .github/scripts/clang-tidy-fixes-to-sast-report.py --base-directory $REPO_HOME --fixes-file $REPO_HOME/clang-fixes.yml --output-yaml-file $REPO_HOME/sast-report.yml --output-md-file $REPO_HOME/sast-report.md

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: sast-${{ inputs.product }}
        path: ${{ env.REPO_HOME }}/sast-report*
        if-no-files-found: error
        retention-days: 30
